<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Swift Drip Menu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #171717;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: #202020;
      border-bottom: 1px solid #3a3a3a;
    }
    .brand { font-size: 17px; font-weight: 800; letter-spacing: .4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions a {
      display: inline-block;
      padding: 9px 12px;
      border-radius: 8px;
      background: #ff5050;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .actions a.secondary { background: #383838; border: 1px solid #555; }
    main { flex: 1; min-height: 0; padding: 0; }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 58px);
      min-height: 450px;
      border: 0;
      background: #fff;
    }
    .fallback {
      padding: 20px;
      text-align: center;
      color: #ddd;
      font-size: 14px;
    }
    .fallback a { color: #ff7777; }
    @media (max-width: 520px) {
      .topbar { padding: 10px; align-items: flex-start; }
      .brand { font-size: 15px; padding-top: 7px; }
      .actions { gap: 6px; justify-content: flex-end; }
      .actions a { padding: 8px 9px; font-size: 12px; }
      iframe { height: calc(100vh - 58px); min-height: 400px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">SWIFT DRIP · MENU</div>
    <nav class="actions" aria-label="PDF actions">
      <a href="menu.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a class="secondary" href="menu.pdf" download>Download</a>
    </nav>
  </header>
  <main>
    <iframe src="menu.pdf#view=FitH" title="Swift Drip menu PDF">
      <div class="fallback">
        Your browser cannot display the PDF inline.
        <a href="menu.pdf" target="_blank" rel="noopener">Open the menu PDF</a>.
      </div>
    </iframe>
  </main>
</body>
</html>
